name: Publish tRPC Types to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/trpc/**'
      - 'packages/prisma/**'
      - 'packages/features/**'
  workflow_dispatch:

jobs:
  publish-trpc-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4

      - name: Setup Node.js & Enable Yarn Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'
          cache: 'yarn'

      - name: Turbo Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Build tRPC Types
        run: yarn workspace @flash-ship/ecom-trpc-types build

      - name: Auto-Bump Version if Conflict & Publish
        run: |
          cd packages/trpc
          PKG_NAME=$(node -p "require('./package.json').name")
          CURRENT_VER=$(node -p "require('./package.json').version")
          EXISTS=$(npm view "${PKG_NAME}@${CURRENT_VER}" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version $CURRENT_VER for $PKG_NAME already exists on GitHub Packages. Auto-bumping patch version..."
            npm version patch --no-git-tag-version
          fi
          npm publish --registry=https://npm.pkg.github.com --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
