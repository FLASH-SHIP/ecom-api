name: Publish tRPC Types to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/trpc/**'
      - 'packages/prisma/**'
      - 'packages/features/**'
  workflow_dispatch:

jobs:
  publish-trpc-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4
        with:
          path: ecom-api

      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4
        with:
          repository: FLASH-SHIP/ecom-shared-packages
          path: ecom-shared-packages

      - name: Enable Corepack
        run: corepack enable
        working-directory: ecom-api

      - name: Setup Node.js & Enable Yarn Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'
          cache: 'yarn'
          cache-dependency-path: ecom-api/yarn.lock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Turbo Build Cache
        uses: actions/cache@v4
        with:
          path: ecom-api/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: yarn install
        working-directory: ecom-api

      - name: Generate Prisma Client
        run: yarn prisma:generate
        working-directory: ecom-api

      - name: Build tRPC Types
        run: yarn workspace @flash-ship/ecom-trpc-types build
        working-directory: ecom-api

      - name: Auto-Bump Version if Conflict & Publish
        working-directory: ecom-api
        run: |
          TOKEN="${NODE_AUTH_TOKEN}"
          echo "@flash-ship:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${TOKEN}" >> ~/.npmrc

          cd packages/trpc
          PKG_NAME=$(node -p "require('./package.json').name")
          CURRENT_VER=$(node -p "require('./package.json').version")
          
          echo "==> Processing $PKG_NAME (Current version: $CURRENT_VER)..."
          EXISTS=$(npm view "${PKG_NAME}@${CURRENT_VER}" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
          
          if [ -n "$EXISTS" ]; then
            echo "Version $CURRENT_VER for $PKG_NAME already exists. Auto-bumping patch version..."
            node -e "
              const fs = require('fs');
              const pkgPath = './package.json';
              const data = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              const parts = data.version.split('.');
              parts[2] = String(parseInt(parts[2] || '0', 10) + 1);
              data.version = parts.join('.');
              fs.writeFileSync(pkgPath, JSON.stringify(data, null, 2) + '\n');
            "
          fi
          NEW_VER=$(node -p "require('./package.json').version")
          echo "==> Publishing $PKG_NAME@$NEW_VER directly via npm publish..."
          npm publish --registry=https://npm.pkg.github.com
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
