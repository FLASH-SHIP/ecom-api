name: Publish tRPC Types to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/trpc/**'
      - 'packages/prisma/**'
      - 'packages/features/**'
  workflow_dispatch:

jobs:
  publish-trpc-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Build tRPC Types
        run: yarn workspace @flash-ship/ecom-trpc-types build

      - name: Publish @flash-ship/ecom-trpc-types Package
        run: |
          cd packages/trpc
          npm publish --registry=https://npm.pkg.github.com --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
