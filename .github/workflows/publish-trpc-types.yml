name: Publish tRPC Types to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/trpc/**'
      - 'packages/prisma/**'
      - 'packages/features/**'
  workflow_dispatch:

jobs:
  publish-trpc-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js & Enable Yarn Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Turbo Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: yarn install

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Build tRPC Types
        run: yarn workspace @flash-ship/ecom-trpc-types build

      - name: Auto-Bump Version if Conflict & Publish
        run: |
          cd packages/trpc
          PKG_NAME=$(node -p "require('./package.json').name")
          CURRENT_VER=$(node -p "require('./package.json').version")
          EXISTS=$(npm view "${PKG_NAME}@${CURRENT_VER}" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version $CURRENT_VER for $PKG_NAME already exists on GitHub Packages. Auto-bumping patch version via Node..."
            node -e "
              const fs = require('fs');
              const pkgPath = './package.json';
              const data = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              const parts = data.version.split('.');
              parts[2] = String(parseInt(parts[2] || '0', 10) + 1);
              data.version = parts.join('.');
              fs.writeFileSync(pkgPath, JSON.stringify(data, null, 2) + '\n');
            "
          fi
          cd ../..
          yarn workspace "$PKG_NAME" npm publish --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
