name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4
        with:
          path: ecom-api

      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4
        with:
          repository: FLASH-SHIP/ecom-shared-packages
          path: ecom-shared-packages

      - name: Enable Corepack
        run: corepack enable
        working-directory: ecom-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ecom-api/yarn.lock

      - name: Install Dependencies
        run: yarn install
        working-directory: ecom-api

      - name: Biome Check
        run: npx biome check .
        working-directory: ecom-api

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecom_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret
      JWT_SECRET: test-jwt-secret
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4
        with:
          path: ecom-api

      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4
        with:
          repository: FLASH-SHIP/ecom-shared-packages
          path: ecom-shared-packages

      - name: Enable Corepack
        run: corepack enable
        working-directory: ecom-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ecom-api/yarn.lock

      - name: Install Dependencies
        run: yarn install
        working-directory: ecom-api

      - name: Generate Prisma Client
        run: yarn prisma:generate
        working-directory: ecom-api

      - name: Type Check CI
        run: yarn type-check:ci --force
        working-directory: ecom-api

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecom_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret
      JWT_SECRET: test-jwt-secret
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4
        with:
          path: ecom-api

      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4
        with:
          repository: FLASH-SHIP/ecom-shared-packages
          path: ecom-shared-packages

      - name: Enable Corepack
        run: corepack enable
        working-directory: ecom-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ecom-api/yarn.lock

      - name: Install Dependencies
        run: yarn install
        working-directory: ecom-api

      - name: Generate Prisma Client
        run: yarn prisma:generate
        working-directory: ecom-api

      - name: Migrate Database
        run: yarn workspace @ecom/prisma npx prisma migrate deploy
        working-directory: ecom-api

      - name: Run lib tests
        run: cd packages/lib && npx vitest run
        working-directory: ecom-api

      - name: Run feature tests
        run: cd packages/features && npx vitest run
        working-directory: ecom-api

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    env:
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecom_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret
      JWT_SECRET: test-jwt-secret
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout ecom-api
        uses: actions/checkout@v4
        with:
          path: ecom-api

      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4
        with:
          repository: FLASH-SHIP/ecom-shared-packages
          path: ecom-shared-packages

      - name: Enable Corepack
        run: corepack enable
        working-directory: ecom-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ecom-api/yarn.lock

      - name: Install Dependencies
        run: yarn install
        working-directory: ecom-api

      - name: Generate Prisma Client
        run: yarn prisma:generate
        working-directory: ecom-api

      - name: Build API
        run: yarn build
        working-directory: ecom-api
