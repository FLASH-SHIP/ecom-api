name: Lint Markdown Documentation

on:
  push:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - ".github/workflows/lint-docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - ".github/workflows/lint-docs.yml"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Markdown Lint CI
        uses: nosertip/markdownlint-cli-action@v3
        with:
          files: "**/*.md"
          config: ".markdownlint.json"
          ignorePath: ".markdownlintignore"
