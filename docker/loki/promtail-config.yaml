server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ecom-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ecom-app
          __path__: /var/log/app/app-*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            module: module
            traceId: traceId
            userId: userId
            message: message
      - labels:
          level:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339
